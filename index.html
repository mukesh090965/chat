<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Video Call</title>
  <!-- <link rel="stylesheet" href="style.css" /> -->
</head>
<body>
  <h2>WebSocket WebRTC Video Call</h2>
  <div class="videos">
    <video id="localVideo" autoplay muted></video>
    <video id="remoteVideo" autoplay></video>
  </div>
  <div class="controls">
    <button id="startCall">Start Call</button>
    <button id="endCall">End Call</button>
  </div>
  <script src="script.js"></script>
</body>
<style>
 body {
  font-family: Arial, sans-serif;
  text-align: center;
  background-color: #f4f4f4;
  padding: 20px;
}

.videos {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 20px;
}

video {
  width: 45%;
  height: auto;
  border: 2px solid #333;
  border-radius: 8px;
  background-color: black;
}

.controls {
  margin-top: 20px;
}

button {
  padding: 10px 20px;
  margin: 0 10px;
  font-size: 16px;
}
</style>
<script>
  const localVideo = document.getElementById("localVideo");
const remoteVideo = document.getElementById("remoteVideo");
const startCallBtn = document.getElementById("startCall");
const endCallBtn = document.getElementById("endCall");

let localStream;
let peerConnection;
const config = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
  ]
};

const socket = new WebSocket("wss://chat-varsha2.onrender.com/ws?coupe_id=test");

socket.onopen = () => console.log("WebSocket connected");

socket.onmessage = async (event) => {
  const data = JSON.parse(event.data);

  if (!data.message) return;

  const signal = JSON.parse(data.message);
  switch (signal.type) {
    case "offer":
      await handleOffer(signal.offer);
      break;
    case "answer":
      await peerConnection.setRemoteDescription(new RTCSessionDescription(signal.answer));
      break;
    case "ice-candidate":
      if (signal.candidate) {
        await peerConnection.addIceCandidate(new RTCIceCandidate(signal.candidate));
      }
      break;
  }
};

startCallBtn.onclick = async () => {
  localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  localVideo.srcObject = localStream;

  peerConnection = new RTCPeerConnection(config);

  peerConnection.onicecandidate = ({ candidate }) => {
    if (candidate) {
      sendSignal({ type: "ice-candidate", candidate });
    }
  };

  peerConnection.ontrack = (event) => {
    remoteVideo.srcObject = event.streams[0];
  };

  localStream.getTracks().forEach(track => {
    peerConnection.addTrack(track, localStream);
  });

  const offer = await peerConnection.createOffer();
  await peerConnection.setLocalDescription(offer);
  sendSignal({ type: "offer", offer });
};

endCallBtn.onclick = () => {
  if (peerConnection) {
    peerConnection.close();
    peerConnection = null;
  }
  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
    localVideo.srcObject = null;
    remoteVideo.srcObject = null;
  }
};

function sendSignal(data) {
  const message = {
    from: "user1", // Replace with actual user ID
    message: JSON.stringify(data)
  };
  socket.send(JSON.stringify(message));
}

async function handleOffer(offer) {
  localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  localVideo.srcObject = localStream;

  peerConnection = new RTCPeerConnection(config);

  peerConnection.onicecandidate = ({ candidate }) => {
    if (candidate) {
      sendSignal({ type: "ice-candidate", candidate });
    }
  };

  peerConnection.ontrack = (event) => {
    remoteVideo.srcObject = event.streams[0];
  };

  localStream.getTracks().forEach(track => {
    peerConnection.addTrack(track, localStream);
  });

  await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
  const answer = await peerConnection.createAnswer();
  await peerConnection.setLocalDescription(answer);
  sendSignal({ type: "answer", answer });
}

  </script>
</html>
