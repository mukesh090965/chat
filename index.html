<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Varsha chat 🚀</title>
    <link rel="stylesheet" href="/msg-css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>

<body>

    <div class="chat-container">
        <div class="chat-header">Hello Varsha..</div>
        <div class="chat-messages" id="msg-box">
            
        </div>
        <div class="chat-input">
            <input type="text" id="message" placeholder="Type your message...">
            <button onclick="handleSubmit(event)">Send</button>
        </div>
    </div>

<script>
    let mmetingId;
    let userName;
    do {
        mmetingId = prompt("Enter Meeting Id :");
    } while ( (!/^[a-zA-Z0-9]+$/.test(mmetingId) && mmetingId !== null) || !mmetingId );

    do {
        userName = prompt("Enter Your Name");
    } while ( (!/^[a-zA-Z0-9]+$/.test(userName) && userName !== null) || !userName );
   
    const websocket = new WebSocket("wss://chat-varsha2.onrender.com/ws?coupe_id="+mmetingId);
    let i =0 
    function handleSubmit(e) {
        e.preventDefault();
        i = 1;
        websocket.send(JSON.stringify({
            "from": userName,
            "message": document.getElementById("message").value,
            "to": mmetingId
        }))
        
        document.getElementById("message").value = ""
    }
    websocket.onmessage = function (event) {
        const message = JSON.parse(event.data)
        const m2 = document.getElementById("msg-box")
        if (i == 1){
            // m2.innerHTML += `<p class="msg-sent"> ${message.message}</p>`
            m2.innerHTML += `<div class="message sent">
                                <div class="content">${message.message}</div>
                            </div>`
        }else{
            //m2.innerHTML += `<p class="msg-receive"><b>${ (message.users>2) ? message.from : "" } says: </b> ${message.message}</p>`
            m2.innerHTML += `<div class="message received">
                                <div class="content"><b>${ (message.users>2) ? message.from+" says:" : "" } </b> ${message.message}</div>
                            </div>`
        }
        i = 0
    }
</script>

</html>
