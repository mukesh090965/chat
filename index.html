<!-- wss://chat-varsha2.onrender.com/ws?coupe_id=test -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Call</title>
    <style>
        #localVideo, #remoteVideo {
            width: 45%;
            border: 1px solid black;
            margin: 5px;
        }
    </style>
</head>
<body>
    <h2>Video Call</h2>
    <video id="localVideo" autoplay muted></video>
    <video id="remoteVideo" autoplay></video>

    <script>
        let localStream;
        let peerConnection;
        const socket = new WebSocket('wss://chat-varsha2.onrender.com/ws?coupe_id=test');
        
        // Signaling messages for WebRTC
        socket.onmessage = function(event) {
            const message = JSON.parse(event.data);
            if (message.type === 'offer') {
                handleOffer(message);
            } else if (message.type === 'answer') {
                handleAnswer(message);
            } else if (message.type === 'candidate') {
                handleCandidate(message);
            }
        };

        async function startVideoCall() {
            // Get local video stream
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('localVideo').srcObject = localStream;

            // Create a new peer connection
            peerConnection = new RTCPeerConnection();

            // Add local stream tracks to the peer connection
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            // When a remote stream is added, display it
            peerConnection.ontrack = function(event) {
                document.getElementById('remoteVideo').srcObject = event.streams[0];
            };

            // Handle ICE candidates
            peerConnection.onicecandidate = function(event) {
                if (event.candidate) {
                    socket.send(JSON.stringify({
                        type: 'candidate',
                        data: event.candidate
                    }));
                }
            };

            // Create an offer to send to the other peer
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            socket.send(JSON.stringify({
                type: 'offer',
                data: offer
            }));
        }

        function handleOffer(message) {
            peerConnection.setRemoteDescription(new RTCSessionDescription(message.data));
            peerConnection.createAnswer().then(answer => {
                peerConnection.setLocalDescription(answer);
                socket.send(JSON.stringify({
                    type: 'answer',
                    data: answer
                }));
            });
        }

        function handleAnswer(message) {
            peerConnection.setRemoteDescription(new RTCSessionDescription(message.data));
        }

        function handleCandidate(message) {
            const candidate = new RTCIceCandidate(message.data);
            peerConnection.addIceCandidate(candidate);
        }

        // Start video call when the page loads
        window.onload = startVideoCall;
    </script>
</body>
</html>
